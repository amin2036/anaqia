<style>*{margin:0;padding:0;box-sizing:border-box}
body{width:1640px;height:924px;overflow:hidden;font-family:Poppins,'Hind Siliguri',sans-serif;color:#fff;position:relative;background:radial-gradient(900px 600px at 15% 10%,rgba(255,255,255,.18),transparent 60%),radial-gradient(800px 600px at 90% 90%,rgba(253,224,71,.28),transparent 60%),linear-gradient(135deg,#5B21B6 0%,#9333EA 30%,#DB2777 65%,#F97316 100%)}
.dots{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.14) 2px,transparent 2px);background-size:36px 36px;opacity:.7}
.blob{position:absolute;border-radius:50%;filter:blur(2px)}
/* LEFT text block: x 150-760, y 175-470 (visible on desktop + mobile, above the profile picture) */

h1{font-size:54px;line-height:1.12;font-weight:800;text-shadow:0 6px 24px rgba(76,5,25,.3)}
h1 span{color:#FDE047}
.bn{font-family:'Hind Siliguri',sans-serif;font-size:31px;font-weight:700;margin-top:12px;opacity:.95}
/* Bottom-left contact block: x 150-440, y 500-740 (left of the mobile profile picture) */
.contact{position:absolute;left:150px;top:505px;display:flex;flex-direction:column;gap:14px}
.pill{display:inline-flex;align-items:center;gap:10px;font-size:25px;font-weight:700;padding:13px 24px;border-radius:16px;width:fit-content}
.web{background:#fff;color:#BE185D;box-shadow:0 12px 28px rgba(76,5,25,.3)}
.wa{background:#25D366;box-shadow:0 12px 28px rgba(6,95,70,.3)}
.cod{font-family:'Hind Siliguri',sans-serif;background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.5);font-size:23px}
/* RIGHT visual: x 930-1500 */
.photo{position:absolute;left:960px;top:150px;width:520px;height:600px;border-radius:36px;background:url(hero.jpg) 55% center/cover;border:8px solid rgba(255,255,255,.9);box-shadow:0 30px 60px rgba(76,5,25,.45);transform:rotate(3deg)}
.card{position:absolute;width:170px;height:170px;border-radius:28px;background-size:cover;background-position:center;border:6px solid #fff;box-shadow:0 18px 40px rgba(76,5,25,.4)}
.badge{position:absolute;left:1350px;top:165px;width:150px;height:150px;border-radius:50%;background:#FDE047;color:#9D174D;display:grid;place-items:center;text-align:center;font-weight:800;font-size:30px;line-height:1.05;box-shadow:0 16px 34px rgba(76,5,25,.35);transform:rotate(-10deg)}
.badge small{display:block;font-size:17px;font-weight:700}
