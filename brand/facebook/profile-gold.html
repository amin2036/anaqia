<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Playfair+Display:wght@600;700&family=Hind+Siliguri:wght@600;700&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1080px;overflow:hidden;font-family:Poppins,sans-serif;background:radial-gradient(900px 600px at 20% 15%,rgba(212,175,55,.16),transparent 60%),radial-gradient(800px 600px at 90% 90%,rgba(212,175,55,.12),transparent 60%),linear-gradient(135deg,#0B0B0C 0%,#17140F 55%,#0B0B0C 100%);display:grid;place-items:center;position:relative}
.pat{position:absolute;inset:0;background-image:repeating-linear-gradient(45deg,rgba(212,175,55,.10) 0 1px,transparent 1px 34px),repeating-linear-gradient(-45deg,rgba(212,175,55,.10) 0 1px,transparent 1px 34px);-webkit-mask-image:radial-gradient(circle,transparent 40%,#000 75%);mask-image:radial-gradient(circle,transparent 40%,#000 75%)}
.ring{position:absolute;left:50%;top:50%;width:900px;height:900px;transform:translate(-50%,-50%);border-radius:50%;border:3px solid rgba(212,175,55,.55);box-shadow:0 0 0 14px rgba(0,0,0,.15),0 0 0 17px rgba(212,175,55,.55)}
.wrap{position:relative;display:flex;flex-direction:column;align-items:center;gap:20px;transform:translateY(6px)}
.icon{width:470px;height:470px;filter:drop-shadow(0 30px 50px rgba(0,0,0,.55))}.icon svg{width:100%;height:100%}
.word{font-family:Poppins,sans-serif;color:#F3D98B;font-weight:700;font-size:120px;letter-spacing:-2px;line-height:1}
