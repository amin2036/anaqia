<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#e9ebee;font-family:sans-serif;display:flex;gap:40px;padding:30px;align-items:flex-start}
h3{margin:0 0 10px}
.phone{width:450px;background:#fff;border-radius:24px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.mcover{width:450px;height:270px;background:url(anaqia-facebook-cover-gold.png) center/cover;position:relative}
.mpic{position:absolute;left:50%;top:240px;width:200px;height:200px;margin-left:-100px;margin-top:-100px;border-radius:50%;border:5px solid #fff;background:url(anaqia-facebook-profile-gold.png) center/cover}
.mbody{height:170px;text-align:center;padding-top:110px;font-weight:700;font-size:22px}
.desk{width:820px;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.dcover{width:820px;height:304px;background:url(anaqia-facebook-cover-gold.png) center/cover}
.dbar{height:110px;position:relative}
.dpic{position:absolute;left:30px;top:-40px;width:150px;height:150px;border-radius:50%;border:5px solid #fff;background:url(anaqia-facebook-profile-gold.png) center/cover}
.dname{position:absolute;left:200px;top:20px;font-weight:700;font-size:26px}
</style></head><body>
<div><h3>Mobile</h3><div class="phone"><div class="mcover"><div class="mpic"></div></div><div class="mbody">anaqia</div></div></div>
<div><h3>Desktop</h3><div class="desk"><div class="dcover"></div><div class="dbar"><div class="dpic"></div><div class="dname">anaqia</div></div></div></div>
</body></html>
